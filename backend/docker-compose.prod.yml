version: '3.9'

services:
  backend:
    image: vishnucheruvakkara/moocsphere-backend:latest

    container_name: moocsphere_backend

    env_file:
      - .env

    ports:
      - "8000:8000"

    depends_on:
      - db

    restart: unless-stopped

    command: >
      gunicorn mooc_sphere.wsgi:application
      --bind 0.0.0.0:8000 
      
    volumes:
      - /home/tradeclov/staticfiles:/app/staticfiles

  db:
    image: postgres:15

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: